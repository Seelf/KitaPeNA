<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Too Many Requests - Kitapena</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1e1e1e;
            color: #ccc;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .error-box {
            background: #252526;
            padding: 40px;
            border: 1px solid #440000;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            width: 350px;
            text-align: center;
        }

        h1 {
            color: #ff4444;
            margin: 0 0 20px 0;
            font-size: 48px;
            font-weight: 600;
        }

        h2 {
            color: #fff;
            margin: 0 0 15px 0;
            font-size: 20px;
            font-weight: normal;
        }

        p {
            font-size: 14px;
            color: #999;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            text-decoration: none;
            transition: background 0.2s;
            font-size: 14px;
        }

        .btn:hover {
            background: #444;
            border-color: #666;
        }

        .timer {
            font-family: monospace;
            background: #000;
            padding: 5px 10px;
            border-radius: 4px;
            color: #ff4444;
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="error-box">
        <h1>429</h1>
        <h2>Too Many Requests</h2>
        <p>
            You have exceeded the request limit for this action.<br>
            Please wait a moment before trying again to keep the service stable for everyone.
        </p>

        {% if description %}
        <div class="timer">{{ description }}</div>
        {% endif %}

        <br>
        <a href="/" class="btn">Return Home</a>
    </div>
</body>

</html>
